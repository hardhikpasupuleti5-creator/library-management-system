apiVersion: apps/v1

kind: Deployment

metadata:
  name: library-management

spec:
  replicas: 2

  selector:
    matchLabels:
      app: library

  template:
    metadata:
      labels:
        app: library

    spec:
      containers:
        - name: library-container
          image: library-management-system:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

---
apiVersion: v1

kind: Service

metadata:
  name: library-service

spec:
  type: NodePort

  selector:
    app: library

  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080